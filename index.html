<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Fylo data storage component</title>
    <link rel="stylesheet" href="master.css" />
    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <!DOCTYPE html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Googl-Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
          href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
          rel="stylesheet"
        />
        <!-- ! -->
        <link rel="stylesheet" href="master.css" />
        <title>Document</title>
      </head>
      <body>
        <!-- *Left-container-start -->
        <div class="main-cont">
          <div class="cont-left">
            <div class="logo-cont">
              <img src="images/logo.svg" alt="" />
            </div>
            <div class="icons-cont">
              <div class="document icon">
                <img src="images/icon-document.svg" alt="" />
              </div>
              <div class="folder icon">
                <img src="images/icon-folder.svg" alt="" />
              </div>
              <div class="upload icon">
                <img src="images/icon-upload.svg" alt="" />
              </div>
            </div>
          </div>
          <!-- *Left-container-end -->
          <!-- !*****************! -->
          <!-- *Right-container-start -->
          <div class="cont-right">
            <div class="msg"><span>690</span> GB Left</div>
            <p>You’ve used <span>815 GB</span> of your storage</p>
            <div class="tringle"></div>
            <div class="bar-cont">
              
              <div class="bar-in"><div class="wheel"></div></div> 
            </div>
            
            <div class="gb-cont">
              <h3>0GB</h3>
              <h3>1000GB</h3>
            </div>
          </div>
          <!-- *Right-container-end -->
        </div>
      </body>
    </html>
    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by <a href="https://github.com/NourAdwe">Nour-Adwe</a>.
    </div>
  </body>
</html>
